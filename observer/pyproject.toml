[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pigeon-observer"
version = "0.1.0"
description = "Offline observer and evaluation package for PigeonControl behavior datasets."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "PigeonControl" }]
keywords = ["pigeons", "simulation", "behavior", "evaluation", "retrieval"]
dependencies = [
    "numpy>=1.24",
    "pyarrow>=14.0",
    "Pillow>=10.0",
    "torch>=2.1",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
pigeon-observer = "pigeon_observer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
